[project]
name = "vts"
version = "0.1.0"
description = "Verifiable TradingAgents System — point-in-time data layer, backtest harness, risk layer"
readme = "docs/step0_code_reading.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:vts.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
